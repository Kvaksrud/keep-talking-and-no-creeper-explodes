pluginManagement {
	repositories {
		gradlePluginPortal()
	}
}

plugins {
	// Downloads the JDK the toolchain asks for (java_version) when it isn't installed.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Should match your modid
rootProject.name = 'keep-talking-and-no-creeper-explodes'
