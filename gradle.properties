# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.259
# FML's major version; NeoForge 21.1 ships FML 4
loader_version_range=[4,)
moddev_version=2.0.148

# Java the game runs on; CI sets up this version, and Gradle downloads it for the toolchain when missing
java_version=21

# Mod Properties
# Bump mod_version to publish a new release: CI tags v<mod_version>+mc<minecraft_version>-neoforge when this branch is pushed.
mod_version=1.1.0
archives_base_name=ktance-neoforge
group=no.kvaksrud

# Dependencies
junit_version=6.0.3
