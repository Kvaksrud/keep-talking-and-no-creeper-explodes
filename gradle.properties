# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Java the game runs on; CI sets up this version, and Gradle downloads it locally if it's missing
java_version=21

# Mod Properties
# Bump mod_version to publish a new release: CI tags v<mod_version>+mc<minecraft_version> when this branch is pushed.
mod_version=1.1.0
archives_base_name=ktance-fabric
group=no.kvaksrud

# Dependencies
fabric_api_version=0.116.17+1.21.1
junit_version=6.0.3
