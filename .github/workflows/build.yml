# Builds every push and pull request and runs the unit tests. On main, mc/<minecraft version> (Fabric) and
# neoforge/<minecraft version>, publishes a GitHub release with the mod jar the first time a version is seen:
# bump mod_version in gradle.properties to release again. Each branch targets one Minecraft version and one
# loader, so each gets its own tag.

name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: read java version
        id: props
        run: echo "java=$(grep '^java_version=' gradle.properties | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.props.outputs.java }}
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: game tests
        run: ./gradlew runGameTestServer
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

      - name: publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/mc/') || startsWith(github.ref, 'refs/heads/neoforge/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prop() { grep "^$1=" gradle.properties | cut -d= -f2-; }
          MOD_VERSION=$(prop mod_version)
          MC_VERSION=$(prop minecraft_version)
          JAVA_VERSION=$(prop java_version)
          LOADER=$(prop archives_base_name | sed 's/^ktance-//')

          if [ "$LOADER" = neoforge ]; then
            LOADER_NAME=NeoForge
            TAG="v${MOD_VERSION}+mc${MC_VERSION}-neoforge"
            REQUIREMENTS="| NeoForge | $(prop neo_version) or newer |"
            INSTALL_EXTRA=""
          else
            LOADER_NAME=Fabric
            TAG="v${MOD_VERSION}+mc${MC_VERSION}"
            REQUIREMENTS="| Fabric Loader | $(prop loader_version) or newer |
          | Fabric API | $(prop fabric_api_version) or newer |"
            INSTALL_EXTRA=" and Fabric API"
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG is already released. Bump mod_version in gradle.properties to publish a new release."
            exit 0
          fi

          JAR=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$')

          # "Latest" goes to the newest Minecraft version on Fabric, not whichever branch happened to release last.
          NEWEST_MC=$( (gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -v -- '-neoforge$' | sed -n 's/.*+mc//p'; echo "$MC_VERSION") | sort -V | tail -1)
          LATEST=$([ "$LOADER" = fabric ] && [ "$NEWEST_MC" = "$MC_VERSION" ] && echo true || echo false)

          cat > notes.md <<EOF
          Keep Talking and No Creeper Explodes **${MOD_VERSION}** for **Minecraft ${MC_VERSION}** (${LOADER_NAME}).

          | Requirement | Version |
          |---|---|
          | Minecraft | ${MC_VERSION} |
          ${REQUIREMENTS}
          | Java | ${JAVA_VERSION} |

          **Install:** put \`$(basename "$JAR")\`${INSTALL_EXTRA} in your \`mods\` folder.
          EOF

          gh release create "$TAG" "$JAR" \
            --target "$GITHUB_SHA" \
            --latest="$LATEST" \
            --title "Keep Talking and No Creeper Explodes ${MOD_VERSION} (Minecraft ${MC_VERSION}, ${LOADER_NAME})" \
            --notes-file notes.md
