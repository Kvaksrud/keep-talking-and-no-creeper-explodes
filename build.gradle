plugins {
	// 1.21.1 is obfuscated, so this is the remapping flavour of Loom (newer versions use net.fabricmc.fabric-loom).
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

// Usual mod file naming: ktance-fabric-<mod version>+mc<minecraft version>.jar (Keep Talking And No Creeper Explodes)
version = "${project.mod_version}+mc${project.minecraft_version}"

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"nocreeperexplodes" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Automated in-game tests live in src/gametest. There are no client game tests on 1.21.1, so they are
	// server game tests; the gameTest run below starts them with ./gradlew runGameTest.
	configureTests {
		createSourceSet = true
		modId = "nocreeperexplodes-test"
		// Turning this on would also make ./gradlew build start a game server; the run below doesn't.
		enableGameTests = false
		enableClientGameTests = false
	}
}

// Below fabricApi, which creates the gametest source set.
loom {
	runs {
		// Headless test server: runs every @GameTest in src/gametest, then stops. Fails if a test fails.
		gameTest {
			server()
			name = "Game Test"
			source sourceSets.gametest
			property "fabric-api.gametest"
			property "fabric-api.gametest.report-file", "${layout.buildDirectory.get().asFile}/run/gameTest/junit.xml"
			runDir "build/run/gameTest"
		}

		// Opens a game window and plays the client side through (panel, tear, beeps), then quits: see
		// NoCreeperExplodesClientSmokeTest. Needs a display, so it's for local runs only, not CI or ./gradlew build.
		clientSmokeTest {
			client()
			name = "Client Smoke Test"
			source sourceSets.gametest
			property "nocreeperexplodes.clientSmokeTest"
			runDir "build/run/clientSmokeTest"
		}
	}
}

// A fresh game every time, so the settings file and the test world are written from scratch.
["gameTest", "clientSmokeTest"].each { run ->
	def clean = tasks.register("clean${run.capitalize()}Run", Delete) {
		delete layout.buildDirectory.dir("run/${run}")
	}

	tasks.named("run${run.capitalize()}") {
		dependsOn clean
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Unit tests for the parts that don't need a running game (settings file, bomb timer); ./gradlew test
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	// Minecraft's logging setup is on the test classpath and writes logs/ into the working directory.
	def testRunDir = layout.buildDirectory.dir("test-run").get().asFile
	workingDir = testRunDir
	doFirst { testRunDir.mkdirs() }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = project.java_version as int
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	// Compiles, tests and runs the game on this Java version, downloading it if needed (see settings.gradle).
	toolchain {
		languageVersion = JavaLanguageVersion.of(project.java_version as int)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
