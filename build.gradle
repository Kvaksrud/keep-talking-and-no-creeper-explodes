plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version "${moddev_version}"
}

// Usual mod file naming: ktance-neoforge-<mod version>+mc<minecraft version>.jar (Keep Talking And No Creeper Explodes)
version = "${project.mod_version}+mc${project.minecraft_version}"

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// ModDevGradle adds the repositories for Minecraft and NeoForge automatically.
}

sourceSets {
	// Server game tests (./gradlew runGameTestServer): loaded as part of the mod in the game test run, left out of the jar.
	gametest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

java {
	withSourcesJar()

	// Gradle itself may run on a newer JDK; compiling and the game runs use the Java Minecraft 1.21.1 ships with.
	toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
}

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
		}

		server {
			server()
			programArgument '--nogui'
		}

		// Starts a headless server that runs every game test, then exits; a failed test fails the task.
		gameTestServer {
			type = 'gameTestServer'
			sourceSet = sourceSets.gametest
			gameDirectory = layout.buildDirectory.dir('run/gameTestServer')
			systemProperty 'neoforge.enabledGameTestNamespaces', 'nocreeperexplodes'
		}
	}

	mods {
		"nocreeperexplodes" {
			sourceSet sourceSets.main
			sourceSet sourceSets.gametest
		}
	}
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)
// The unit tests don't start the game, but the settings code logs through Minecraft's logging setup.
neoForge.addModdingDependenciesTo(sourceSets.test)

tasks.named('runGameTestServer') {
	// Start without a settings file, so the game test sees it written with the defaults.
	def settingsFile = layout.buildDirectory.file('run/gameTestServer/config/nocreeperexplodes.properties').get().asFile
	doFirst { settingsFile.delete() }
}

dependencies {
	// Unit tests for the parts that don't need a running game (settings file, bomb timer); ./gradlew test
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	// Minecraft's logging setup is on the test classpath and writes logs/ into the working directory.
	def testRunDir = layout.buildDirectory.dir("test-run").get().asFile
	workingDir = testRunDir
	doFirst { testRunDir.mkdirs() }
}

// Fills in META-INF/neoforge.mods.toml from src/main/templates.
def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	def replaceProperties = [
			version                : project.version,
			minecraft_version_range: project.minecraft_version_range,
			neo_version            : project.neo_version,
			loader_version_range   : project.loader_version_range,
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into layout.buildDirectory.dir("generated/sources/modMetadata")
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = project.java_version as int
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
